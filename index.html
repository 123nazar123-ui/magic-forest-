<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neon Dash</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="game-wrap" aria-label="Neon Dash">
        <canvas id="game" width="960" height="540"></canvas>

        <div class="hud" aria-hidden="true">
          <div>
            <span class="label">Attempt</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span class="label">Best</span>
            <strong id="best">0</strong>
          </div>
          <div>
            <span class="label">Progress</span>
            <strong id="speed">0%</strong>
          </div>
          <div>
            <span class="label">Coins</span>
            <strong id="coins">0/3</strong>
          </div>
        </div>

        <div class="progress" aria-hidden="true">
          <div id="progressFill"></div>
        </div>

        <div id="overlay" class="overlay">
          <h1>Neon Dash</h1>
          <p>Вибери рівень</p>
          <div id="levelGrid" class="level-grid" aria-label="Level select"></div>
          <div id="actionRow" class="action-row">
            <button id="menuActionBtn" class="action-button" type="button">Меню</button>
            <button id="retryBtn" class="action-button" type="button">Ще раз</button>
            <button id="nextBtn" class="action-button primary" type="button">Наступний</button>
          </div>
          <button id="startBtn" class="play-button" type="button" aria-label="Start"></button>
        </div>

        <button id="menuBtn" class="menu-button" type="button">Меню</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
